<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2d3d; }
      .subtitle { font: 16px Arial, sans-serif; fill: #5b6b7b; }
      .head { font: 700 18px Arial, sans-serif; fill: #1f2d3d; }
      .text { font: 15px Arial, sans-serif; fill: #2b3b4c; }
      .box { fill: #f7fbff; stroke: #9dbbe6; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #7a8ca5; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .rel { font: 700 14px Arial, sans-serif; fill: #50627b; }
      .guide { stroke: #c7d6eb; stroke-width: 2; fill: none; stroke-dasharray: 5 6; }
    </style>
  </defs>

  <rect width="1480" height="960" fill="#ffffff"/>
  <text x="70" y="65" class="title">Entity Relationship Diagram</text>
  <text x="70" y="95" class="subtitle">Clean layout with orthogonal non-overlapping relations</text>

  <g>
    <rect x="90" y="360" width="260" height="180" class="box"/>
    <line x1="90" y1="410" x2="350" y2="410" class="line"/>
    <text x="220" y="390" text-anchor="middle" class="head">User</text>
    <text x="112" y="445" class="text">PK uid</text>
    <text x="112" y="475" class="text">name</text>
    <text x="112" y="505" class="text">email</text>
  </g>

  <g>
    <rect x="490" y="130" width="310" height="200" class="box"/>
    <line x1="490" y1="180" x2="800" y2="180" class="line"/>
    <text x="645" y="160" text-anchor="middle" class="head">UserProfile</text>
    <text x="512" y="215" class="text">PK profileId</text>
    <text x="512" y="245" class="text">FK uid</text>
    <text x="512" y="275" class="text">goal</text>
    <text x="512" y="305" class="text">targetCalories</text>
  </g>

  <g>
    <rect x="490" y="380" width="310" height="230" class="box"/>
    <line x1="490" y1="430" x2="800" y2="430" class="line"/>
    <text x="645" y="410" text-anchor="middle" class="head">DailyLog</text>
    <text x="512" y="465" class="text">PK date</text>
    <text x="512" y="495" class="text">FK uid</text>
    <text x="512" y="525" class="text">caloriesIn</text>
    <text x="512" y="555" class="text">waterGlasses</text>
    <text x="512" y="585" class="text">protein / carbs / fat</text>
  </g>

  <g>
    <rect x="490" y="660" width="310" height="170" class="box"/>
    <line x1="490" y1="710" x2="800" y2="710" class="line"/>
    <text x="645" y="690" text-anchor="middle" class="head">WeightLog</text>
    <text x="512" y="745" class="text">PK date</text>
    <text x="512" y="775" class="text">FK uid</text>
    <text x="512" y="805" class="text">weightKg</text>
  </g>

  <g>
    <rect x="1030" y="220" width="300" height="180" class="box"/>
    <line x1="1030" y1="270" x2="1330" y2="270" class="line"/>
    <text x="1180" y="250" text-anchor="middle" class="head">FoodItem</text>
    <text x="1052" y="305" class="text">PK id</text>
    <text x="1052" y="335" class="text">FK dailyLogDate</text>
    <text x="1052" y="365" class="text">name / calories</text>
  </g>

  <g>
    <rect x="1030" y="560" width="300" height="180" class="box"/>
    <line x1="1030" y1="610" x2="1330" y2="610" class="line"/>
    <text x="1180" y="590" text-anchor="middle" class="head">WorkoutItem</text>
    <text x="1052" y="645" class="text">PK id</text>
    <text x="1052" y="675" class="text">FK dailyLogDate</text>
    <text x="1052" y="705" class="text">title / minutes</text>
  </g>

  <line x1="420" y1="230" x2="420" y2="745" class="guide"/>
  <line x1="920" y1="310" x2="920" y2="650" class="guide"/>

  <path d="M350 430 L420 430 L420 230 L490 230" class="line"/>
  <text x="378" y="300" class="rel">1 : 1</text>

  <path d="M350 470 L490 470" class="line"/>
  <text x="390" y="458" class="rel">1 : many</text>

  <path d="M350 510 L420 510 L420 745 L490 745" class="line"/>
  <text x="378" y="650" class="rel">1 : many</text>

  <path d="M800 495 L920 495 L920 310 L1030 310" class="line"/>
  <text x="860" y="390" class="rel">1 : many</text>

  <path d="M800 545 L920 545 L920 650 L1030 650" class="line"/>
  <text x="860" y="615" class="rel">1 : many</text>
</svg>
