<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .text { font: 16px Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .line { stroke: #222; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="820" fill="#fff"/>
  <text x="60" y="55" class="title">Use Case Diagram</text>

  <circle cx="150" cy="170" r="25" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="150" y1="195" x2="150" y2="280" class="line"/>
  <line x1="105" y1="230" x2="195" y2="230" class="line"/>
  <line x1="150" y1="280" x2="115" y2="335" class="line"/>
  <line x1="150" y1="280" x2="185" y2="335" class="line"/>
  <text x="150" y="375" text-anchor="middle" class="text">User</text>

  <rect x="300" y="100" width="900" height="620" class="box"/>
  <text x="330" y="135" class="text">Foodcal System</text>

  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <ellipse cx="500" cy="200" rx="110" ry="35"/>
    <ellipse cx="770" cy="200" rx="110" ry="35"/>
    <ellipse cx="1040" cy="200" rx="120" ry="35"/>
    <ellipse cx="500" cy="340" rx="110" ry="35"/>
    <ellipse cx="770" cy="340" rx="110" ry="35"/>
    <ellipse cx="1040" cy="340" rx="120" ry="35"/>
    <ellipse cx="500" cy="480" rx="125" ry="35"/>
    <ellipse cx="770" cy="480" rx="120" ry="35"/>
    <ellipse cx="1040" cy="480" rx="120" ry="35"/>
    <ellipse cx="635" cy="620" rx="150" ry="35"/>
    <ellipse cx="955" cy="620" rx="145" ry="35"/>
  </g>

  <g class="text" text-anchor="middle">
    <text x="500" y="205">Register</text>
    <text x="770" y="205">Login</text>
    <text x="1040" y="205">Set Health Profile</text>
    <text x="500" y="345">View Dashboard</text>
    <text x="770" y="345">Track Food</text>
    <text x="1040" y="345">Log Water</text>
    <text x="500" y="485">Use AI Analysis</text>
    <text x="770" y="485">View Learning Content</text>
    <text x="1040" y="485">Complete Workout</text>
    <text x="635" y="625">Update Profile / Goals</text>
    <text x="955" y="625">Upload Profile Picture</text>
  </g>

  <g class="line">
    <line x1="225" y1="255" x2="390" y2="200"/>
    <line x1="225" y1="265" x2="660" y2="200"/>
    <line x1="225" y1="275" x2="920" y2="200"/>
    <line x1="225" y1="285" x2="390" y2="340"/>
    <line x1="225" y1="295" x2="660" y2="340"/>
    <line x1="225" y1="305" x2="920" y2="340"/>
    <line x1="225" y1="315" x2="375" y2="480"/>
    <line x1="225" y1="325" x2="650" y2="480"/>
    <line x1="225" y1="335" x2="920" y2="480"/>
    <line x1="225" y1="345" x2="485" y2="620"/>
    <line x1="225" y1="355" x2="810" y2="620"/>
  </g>
