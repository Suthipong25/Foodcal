<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .text { font: 16px Arial, sans-serif; fill: #111; }
      .small { font: 14px Arial, sans-serif; fill: #333; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .line { stroke: #222; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="60" y="55" class="title">Data Flow Diagram</text>

  <rect x="70" y="270" width="180" height="90" class="box"/>
  <text x="160" y="318" text-anchor="middle" class="text">User</text>

  <rect x="340" y="220" width="240" height="190" class="box"/>
  <text x="460" y="260" text-anchor="middle" class="text">Flutter UI</text>
  <text x="460" y="295" text-anchor="middle" class="small">Login / Dashboard / Tracking</text>
  <text x="460" y="320" text-anchor="middle" class="small">Learning / Profile</text>

  <rect x="700" y="120" width="220" height="90" class="box"/>
  <text x="810" y="172" text-anchor="middle" class="text">Firebase Auth</text>

  <rect x="700" y="270" width="220" height="100" class="box"/>
  <text x="810" y="322" text-anchor="middle" class="text">Cloud Firestore</text>

  <rect x="700" y="430" width="220" height="90" class="box"/>
  <text x="810" y="482" text-anchor="middle" class="text">Firebase Storage</text>

  <rect x="1020" y="270" width="190" height="100" class="box"/>
  <text x="1115" y="322" text-anchor="middle" class="text">AI Backend</text>

  <line x1="250" y1="300" x2="340" y2="300" class="line" marker-end="url(#arrow)"/>
  <line x1="340" y1="340" x2="250" y2="340" class="line" marker-end="url(#arrow)"/>
  <text x="295" y="290" text-anchor="middle" class="small">input</text>
  <text x="295" y="360" text-anchor="middle" class="small">result</text>

  <line x1="580" y1="240" x2="700" y2="175" class="line" marker-end="url(#arrow)"/>
  <line x1="700" y1="205" x2="580" y2="260" class="line" marker-end="url(#arrow)"/>
  <text x="630" y="180" class="small">authentication</text>

  <line x1="580" y1="315" x2="700" y2="315" class="line" marker-end="url(#arrow)"/>
  <line x1="700" y1="340" x2="580" y2="340" class="line" marker-end="url(#arrow)"/>
  <text x="640" y="302" class="small">read / write data</text>

  <line x1="580" y1="390" x2="700" y2="470" class="line" marker-end="url(#arrow)"/>
  <line x1="700" y1="500" x2="580" y2="430" class="line" marker-end="url(#arrow)"/>
  <text x="625" y="435" class="small">upload image</text>

  <line x1="580" y1="290" x2="1020" y2="290" class="line" marker-end="url(#arrow)"/>
  <line x1="1020" y1="350" x2="580" y2="365" class="line" marker-end="url(#arrow)"/>
  <text x="800" y="278" text-anchor="middle" class="small">food image / food name</text>
  <text x="805" y="386" text-anchor="middle" class="small">nutrition result</text>
</svg>
