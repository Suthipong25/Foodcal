<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #52708c; }
      .boxTitle { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .boxText { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #35516c; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #1f4f7a; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #35516c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d86c6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b6cbe2" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f4f9ff"/>
  <text x="80" y="70" class="title">Foodcal Data Flow Diagram</text>
  <text x="80" y="105" class="subtitle">Flow of data between user, app UI, Firebase services, and AI backend</text>

  <rect x="90" y="240" rx="28" ry="28" width="180" height="220" fill="#e8f2ff" stroke="#8cb6ea" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="180" cy="295" r="34" fill="#ffffff" stroke="#9dc2ef" stroke-width="2"/>
  <circle cx="180" cy="282" r="10" fill="#7aa8e5"/>
  <path d="M148 342c6-24 58-24 64 0" fill="#7aa8e5"/>
  <text x="180" y="390" text-anchor="middle" class="boxTitle">User</text>
  <text x="180" y="420" text-anchor="middle" class="boxText">Registers, logs in,</text>
  <text x="180" y="444" text-anchor="middle" class="boxText">tracks food, water,</text>
  <text x="180" y="468" text-anchor="middle" class="boxText">workouts, and profile</text>

  <rect x="370" y="180" rx="30" ry="30" width="260" height="350" fill="#ffffff" stroke="#b8d2ef" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="235" text-anchor="middle" class="boxTitle">Flutter UI</text>
  <text x="500" y="272" text-anchor="middle" class="boxText">Login / Register</text>
  <text x="500" y="304" text-anchor="middle" class="boxText">Onboarding</text>
  <text x="500" y="336" text-anchor="middle" class="boxText">Dashboard</text>
  <text x="500" y="368" text-anchor="middle" class="boxText">Tracking</text>
  <text x="500" y="400" text-anchor="middle" class="boxText">Learning</text>
  <text x="500" y="432" text-anchor="middle" class="boxText">Profile</text>
  <line x1="425" y1="458" x2="575" y2="458" stroke="#d9e7f6" stroke-width="2"/>
  <text x="500" y="492" text-anchor="middle" class="small">Displays results returned</text>
  <text x="500" y="514" text-anchor="middle" class="small">from Firebase and AI services</text>

  <rect x="760" y="120" rx="28" ry="28" width="250" height="150" fill="#eefaf2" stroke="#93d3ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="175" text-anchor="middle" class="boxTitle">Firebase Auth</text>
  <text x="885" y="210" text-anchor="middle" class="boxText">User sign-up</text>
  <text x="885" y="236" text-anchor="middle" class="boxText">and sign-in status</text>

  <rect x="760" y="330" rx="28" ry="28" width="250" height="170" fill="#eefaf2" stroke="#93d3ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="388" text-anchor="middle" class="boxTitle">Cloud Firestore</text>
  <text x="885" y="423" text-anchor="middle" class="boxText">users/{uid}</text>
  <text x="885" y="449" text-anchor="middle" class="boxText">daily_logs/{date}</text>
  <text x="885" y="475" text-anchor="middle" class="boxText">weight logs and app data</text>

  <rect x="760" y="560" rx="28" ry="28" width="250" height="150" fill="#eefaf2" stroke="#93d3ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="885" y="617" text-anchor="middle" class="boxTitle">Firebase Storage</text>
  <text x="885" y="652" text-anchor="middle" class="boxText">Stores profile pictures</text>
  <text x="885" y="678" text-anchor="middle" class="boxText">and media assets</text>

  <rect x="1110" y="330" rx="28" ry="28" width="220" height="170" fill="#fff6e8" stroke="#f0bb68" stroke-width="2" filter="url(#shadow)"/>
  <text x="1220" y="388" text-anchor="middle" class="boxTitle">AI Backend</text>
  <text x="1220" y="423" text-anchor="middle" class="boxText">Analyze food image</text>
  <text x="1220" y="449" text-anchor="middle" class="boxText">Estimate nutrition</text>
  <text x="1220" y="475" text-anchor="middle" class="boxText">Return food result</text>

  <line x1="270" y1="350" x2="370" y2="350" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="390" x2="270" y2="390" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="337" text-anchor="middle" class="label">input</text>
  <text x="320" y="415" text-anchor="middle" class="label">result</text>

  <line x1="630" y1="220" x2="760" y2="195" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="235" x2="630" y2="255" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="690" y="188" class="label">authenticate</text>
  <text x="690" y="274" class="label">auth state</text>

  <line x1="630" y1="355" x2="760" y2="405" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="445" x2="630" y2="470" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="670" y="365" class="label">read / write user data</text>
  <text x="672" y="497" class="label">profile and logs</text>

  <line x1="630" y1="505" x2="760" y2="615" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="660" x2="630" y2="565" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="596" class="label">upload image</text>
  <text x="648" y="548" class="label">photo URL</text>

  <line x1="630" y1="430" x2="1110" y2="415" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1110" y1="455" x2="630" y2="455" stroke="#4d86c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="930" y="400" text-anchor="middle" class="label">food image / food name</text>
  <text x="930" y="482" text-anchor="middle" class="label">nutrition analysis result</text>

  <rect x="80" y="770" rx="24" ry="24" width="1240" height="90" fill="#ffffff" stroke="#d3e2f2" stroke-width="2"/>
  <text x="110" y="818" class="boxText">Summary: The user interacts with the Flutter UI, which sends authentication requests to Firebase Auth, stores health data in Firestore, uploads images to Storage, and calls the AI backend for food analysis.</text>
</svg>
