<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950">
  <defs>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #52708c; }
      .actorLabel { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .caseText { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .note { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #35516c; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b6cbe2" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="950" fill="#f4f9ff"/>
  <text x="80" y="70" class="title">Foodcal Use Case Diagram</text>
  <text x="80" y="105" class="subtitle">Main user interactions with the Foodcal application</text>

  <g transform="translate(110,250)">
    <circle cx="70" cy="70" r="34" fill="#ffffff" stroke="#8cb6ea" stroke-width="3"/>
    <line x1="70" y1="104" x2="70" y2="200" stroke="#5b84b8" stroke-width="4"/>
    <line x1="18" y1="145" x2="122" y2="145" stroke="#5b84b8" stroke-width="4"/>
    <line x1="70" y1="200" x2="28" y2="272" stroke="#5b84b8" stroke-width="4"/>
    <line x1="70" y1="200" x2="112" y2="272" stroke="#5b84b8" stroke-width="4"/>
    <text x="70" y="320" text-anchor="middle" class="actorLabel">User</text>
  </g>

  <rect x="330" y="150" rx="34" ry="34" width="980" height="700" fill="#ffffff" stroke="#b8d2ef" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="380" y="205" class="actorLabel">Foodcal System</text>

  <g fill="#fefefe" stroke="#9fc2ea" stroke-width="2.2">
    <ellipse cx="530" cy="280" rx="130" ry="42"/>
    <ellipse cx="800" cy="280" rx="130" ry="42"/>
    <ellipse cx="1080" cy="280" rx="130" ry="42"/>

    <ellipse cx="530" cy="410" rx="130" ry="42"/>
    <ellipse cx="800" cy="410" rx="130" ry="42"/>
    <ellipse cx="1080" cy="410" rx="130" ry="42"/>

    <ellipse cx="530" cy="540" rx="130" ry="42"/>
    <ellipse cx="800" cy="540" rx="130" ry="42"/>
    <ellipse cx="1080" cy="540" rx="130" ry="42"/>

    <ellipse cx="665" cy="670" rx="150" ry="42"/>
    <ellipse cx="960" cy="670" rx="150" ry="42"/>
  </g>

  <g class="caseText" text-anchor="middle">
    <text x="530" y="286">Register Account</text>
    <text x="800" y="286">Login</text>
    <text x="1080" y="286">Set Up Health Profile</text>

    <text x="530" y="416">View Dashboard</text>
    <text x="800" y="416">Track Food Intake</text>
    <text x="1080" y="416">Log Water Intake</text>

    <text x="530" y="546">Use AI Food Analysis</text>
    <text x="800" y="546">View Learning Content</text>
    <text x="1080" y="546">Complete Workout</text>

    <text x="665" y="676">Update Profile and Goals</text>
    <text x="960" y="676">Upload Profile Picture</text>
  </g>

  <g stroke="#5b84b8" stroke-width="2.4">
    <line x1="250" y1="380" x2="400" y2="280"/>
    <line x1="250" y1="390" x2="670" y2="280"/>
    <line x1="250" y1="400" x2="950" y2="280"/>

    <line x1="250" y1="425" x2="400" y2="410"/>
    <line x1="250" y1="435" x2="670" y2="410"/>
    <line x1="250" y1="445" x2="950" y2="410"/>

    <line x1="250" y1="470" x2="400" y2="540"/>
    <line x1="250" y1="480" x2="670" y2="540"/>
    <line x1="250" y1="490" x2="950" y2="540"/>

    <line x1="250" y1="515" x2="515" y2="670"/>
    <line x1="250" y1="525" x2="810" y2="670"/>
  </g>

  <rect x="80" y="870" rx="24" ry="24" width="1240" height="50" fill="#ffffff" stroke="#d3e2f2" stroke-width="2"/>
  <text x="105" y="902" class="note">This diagram shows the main functions available to the user, from authentication and profile setup to daily tracking, learning content, workout completion, and AI-assisted food analysis.</text>
</svg>
